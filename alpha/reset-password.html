<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="referrer" content="no-referrer">
  <title>Reset your Syndicate Tycoon password</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #040507; color: #e8e6df; font: 16px/1.5 system-ui, sans-serif; }
    main { max-width: 34rem; margin: 0 auto; padding: 32px 16px; }
    h1 { font-size: 1.4rem; }
    label { display: block; margin: 12px 0 4px; }
    input { width: 100%; box-sizing: border-box; padding: 10px; background: #111318; color: inherit; border: 1px solid #333; border-radius: 4px; font: inherit; }
    button { margin-top: 16px; padding: 10px 16px; background: #19e3ff; color: #00151a; border: 0; border-radius: 4px; font: inherit; font-weight: 700; cursor: pointer; }
    button:disabled { opacity: .5; cursor: default; }
    a { color: #19e3ff; }
    .muted { color: #9a978e; font-size: 14px; }
    .bad { color: #ff3d5e; } .good { color: #42e59a; }
    #msg { margin-top: 16px; }
  </style>
</head>
<body>
<main>
  <img src="logo-stacked.webp" alt="Syndicate Tycoon" width="160">
  <h1>Choose a new password</h1>
  <p class="muted">This link works once and expires one hour after it was sent. Setting a new password signs out every device.</p>
  <form id="f">
    <label for="p">New password (12 characters or more)</label><input id="p" type="password" autocomplete="new-password" minlength="12" maxlength="200" required>
    <label for="c">Confirm new password</label><input id="c" type="password" autocomplete="new-password" required>
    <button id="go" type="submit">Set new password</button>
  </form>
  <p id="msg" role="status"></p>
</main>
<script>
  // The token is after # so it never reaches server logs; remove it from the address bar straight away.
  const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
  history.replaceState(null, '', location.pathname);
  const msg = document.getElementById('msg');
  const say = (text, cls) => { msg.textContent = text; msg.className = cls || ''; };
  if (!token) { say('This page needs the link from your reset email. Ask for a new one under Online → Sign in → Forgot password?', 'bad'); document.getElementById('go').disabled = true; }
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const p = document.getElementById('p').value, c = document.getElementById('c').value;
    if (p.length < 12) return say('Passwords need 12 to 200 characters.', 'bad');
    if (p !== c) return say('The two passwords do not match.', 'bad');
    document.getElementById('go').disabled = true;
    try {
      const r = await fetch('api/reset', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password: p }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { say(d.error || 'That did not work. Ask for a new link.', 'bad'); document.getElementById('go').disabled = false; return; }
      document.getElementById('f').hidden = true;
      msg.className = 'good';
      msg.innerHTML = 'Your password is changed and every device was signed out. <a href="./">Open the game</a> and sign in with your new password.';
    } catch { say('The game server is not reachable.', 'bad'); document.getElementById('go').disabled = false; }
  });
</script>
</body>
</html>
