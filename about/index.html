<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#060c13">
  <meta name="description" content="About Syndicate Tycoon.">
  <link rel="stylesheet" href="../styles.css">
  <title>About · Syndicate Tycoon</title>
  <style>
    .about { min-height: 100svh; display: grid; place-items: center; padding: 32px; background: radial-gradient(circle at top, #102635, #060c13 60%); }
    .about-card { width: min(680px, 100%); border: 1px solid #284658; background: rgb(4 13 22 / 90%); padding: clamp(28px, 6vw, 56px); box-shadow: 0 18px 50px rgb(0 0 0 / 35%); }
    .about-logo { width: 82px; height: auto; float: right; margin: 0 0 18px 22px; }
    .about h1 { line-height: 1.1; margin: 0 0 18px; font-size: clamp(28px, 5vw, 46px); }
    .about p { max-width: 58ch; color: #c5d2da; line-height: 1.65; }
    .about a { color: #82def2; }
    .about-back { display: inline-block; margin-top: 18px; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; text-decoration: none; }
  </style>
</head>
<body>
  <main class="about">
    <article class="about-card">
      <img class="about-logo" src="../assets/logo-stacked.webp" alt="Syndicate Tycoon logo" width="476" height="590">
      <h1>Syndicate Tycoon</h1>
      <p>A long-term business strategy game about building a company, growing a team, and deciding how far you will go to stay ahead.</p>
      <p>The project is being developed in public. The early build is playable at <a href="../alpha/">/alpha</a>.</p>
      <p><a href="https://paypal.me/rennoispoor" target="_blank" rel="noreferrer">Donate to support development</a></p>
      <a class="about-back" href="../">← Back to site</a>
    </article>
  </main>
</body>
</html>
